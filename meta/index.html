<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meta Analysis</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
</head>
<body>
    <h1>Meta</h1>
    <h2>Below this is a detailed analysis that is based on the evolution of the project's codebase</h2>

    <div id="stats"></div>

    <h2>Evolution over time</h2>
    <div id="scrolly-1">
        <div id="scatter-story"></div>

        <div id="scatter-plot">
            <h3>Commits by the Time of the Day</h3>
            <div id="chart"></div>

            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <div id="tooltip" class="tooltip"></div>

    <h2>Codebase evolution</h2>
    <div id="scrolly-2">
        <div id="file-plot">
            <dl id="files"></dl>
        </div>
        <div id="file-story"></div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
